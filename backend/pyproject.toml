[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autopilot-ai-backend"
version = "0.1.0"
description = "AutoPilot AI — Enterprise Multi-Agent Business Automation Platform (backend)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Runtime dependencies grow per milestone. M1 sub-step 1 needs only the
# web framework, ASGI server, and typed settings.
dependencies = [
    "fastapi>=0.111,<0.116",
    "uvicorn[standard]>=0.30,<0.35",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "aiosqlite>=0.20,<0.22",
    "asyncpg>=0.29,<0.31",
    "alembic>=1.13,<2.0",
    "email-validator>=2.1,<3.0",
    "langgraph>=1.2,<2.0",
    "langgraph-checkpoint-sqlite>=3.1,<4.0",
    "langchain-core>=1.4,<2.0",
    "apscheduler>=3.11,<4.0",
    "python-multipart>=0.0.9,<0.1",
    "pypdf>=4.2,<7.0",
    "python-docx>=1.1,<2.0",
    "openpyxl>=3.1,<4.0",
    "httpx>=0.27,<0.29",
    "jinja2>=3.1,<4.0",
]

[project.optional-dependencies]
# OCR for scanned documents. Optional because it also needs the Tesseract
# *binary* (apt-get install tesseract-ocr / brew install tesseract), which pip
# cannot provide -- see app/infrastructure/extraction/ocr.py.
ocr = [
    "pytesseract>=0.3.10,<0.4",
    "pillow>=10.3,<12.0",
    "pypdfium2>=4.30,<5.0",
]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<0.25",
    "ruff>=0.5,<0.7",
    "mypy>=1.10,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ----------------------------------------------------------------------------
# Tooling configuration (single source of truth for lint / type / test)
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]
# Autogenerated migration scripts are not hand-maintained source.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, comprehensions, naming
select = ["E", "F", "I", "UP", "B", "C4", "N"]
ignore = ["B008"]  # FastAPI uses function calls (Depends/Query) in defaults by design

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"
